apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qemu-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 5
  serviceName: qemu-exporter
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: qemu-exporter
  template:
    metadata:
      labels:
        app: qemu-exporter
    annotations:
        openshift.io/required-scc: privileged
    spec:
      serviceAccountName: qemu-exporter
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      volumes:
        - name: registry-ca
          configMap:
            name: registry-service-ca

      initContainers:
        - name: jumpstarter-init
          image: ghcr.io/rhadp-examples/rhas-exporter:latest
          imagePullPolicy: Always
          env:
            - name: JMP_NAMESPACE
              value: "auto-jumpstarter"
            - name: JMP_EXPORTER_NAMESPACE
              value: "auto-exporters"
          command:
            - /bin/bash
            - -c
            - |
              set -eo pipefail
              source /venv/bin/activate

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              API_SERVER=$(oc whoami --show-server)

              mkdir -p ~/.kube

              oc config set-cluster rhas \
                --server=$API_SERVER \
                --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              oc config set-credentials qemu-exporter \
                --token=$TOKEN

              oc config set-context qemu-exporter-ctx \
                --cluster=rhas \
                --user=qemu-exporter \
                --namespace=$JMP_NAMESPACE

              oc config use-context qemu-exporter-ctx

      containers:
        - name: jumpstarter-exporter
          image: ghcr.io/rhadp-examples/rhas-exporter:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 2.0
              memory: "4G"
            requests:
              cpu: 1.0
              memory: "2G"
          securityContext:
            privileged: true
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    source /venv/bin/activate
                    EXPORTER_NAME=$(cat /etc/hostname)
                    echo "Pod is terminating, deleting exporter '$EXPORTER_NAME' ..."
                    timeout 20s oc delete exporter "$EXPORTER_NAME" -n "$JMP_NAMESPACE" --ignore-not-found || true
          volumeMounts:
            - mountPath: /etc/pki/ca-trust/source/anchors/service-ca-bundle.crt
              name: registry-ca
              subPath: service-ca-bundle.crt
              readOnly: true
          env:
            - name: JUMPSTARTER_GRPC_INSECURE
              value: "1"
            - name: JMP_NAMESPACE
              value: "auto-jumpstarter"
            - name: JMP_EXPORTER_NAMESPACE
              value: "auto-exporters"
            - name: OCI_USERNAME
              value: "serviceaccount"
          command:
            - /bin/bash
            - -c
            - |
              set -eo pipefail
              source /venv/bin/activate

              if [ -f /etc/pki/ca-trust/source/anchors/service-ca-bundle.crt ]; then
                  update-ca-trust
              fi

              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              API_SERVER=$(oc whoami --show-server)

              export OCI_PASSWORD="$TOKEN"

              mkdir -p ~/.kube

              oc config set-cluster rhadp \
                --server=$API_SERVER \
                --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt

              oc config set-credentials qemu-exporter \
                --token=$TOKEN

              oc config set-context qemu-exporter-ctx \
                --cluster=rhadp \
                --user=qemu-exporter \
                --namespace=$JMP_NAMESPACE

              oc config use-context qemu-exporter-ctx

              if ! command -v qemu-system-aarch64 &> /dev/null; then
                echo "qemu-system-aarch64 fehlt. Erstelle lokalen Symlink auf das RHEL-Binary qemu-kvm..."
                mkdir -p /tmp/qemu-bin
                ln -s /usr/libexec/qemu-kvm /tmp/qemu-bin/qemu-system-aarch64
                export PATH="/tmp/qemu-bin:$PATH"
              fi

              EXPORTER_NAME=$(cat /etc/hostname)

              if oc get exporter "$EXPORTER_NAME" -n $JMP_NAMESPACE &>/dev/null; then
                echo "Exporter '$EXPORTER_NAME' existiert bereits in Kubernetes. Verwende ihn wieder..."
                while ! oc get secret "${EXPORTER_NAME}-exporter" -n $JMP_NAMESPACE &>/dev/null; do
                  sleep 1
                done
                oc get secret "${EXPORTER_NAME}-exporter" -n $JMP_NAMESPACE -o jsonpath='{.data.token}' | base64 -d > token
              else
                echo "Erstelle völlig neuen Exporter '$EXPORTER_NAME'..."
                jmp admin create exporter "$EXPORTER_NAME" -n $JMP_NAMESPACE --label type=virtual --label device=qemu --save --insecure-tls --nointeractive --out ./dummy.yaml
                yq '.token' dummy.yaml > token
                rm -f ./dummy.yaml
              fi

              while [ -z "$ENDPOINT" ]
              do
                ENDPOINT=$(kubectl get -n $JMP_NAMESPACE \
                  exporters.jumpstarter.dev "$EXPORTER_NAME" -o jsonpath="{.status.endpoint}")
                sleep 1s
              done
              echo "$ENDPOINT" > endpoint

              cat <<EOF > qemu-exporter.yaml
              apiVersion: jumpstarter.dev/v1alpha1
              kind: ExporterConfig
              metadata:
                namespace: $JMP_NAMESPACE
                name: $EXPORTER_NAME
              endpoint: $(cat endpoint)
              tls:
                ca: ''
                insecure: true
              token: $(cat token)
              export:
                console:
                  ref: qemu.console
                flasher:
                  ref: qemu.flasher
                power:
                  ref: qemu.power
                qemu:
                  type: rhas_driver_qemu.driver.Qemu
                  config:
                    smp: 2
                    mem: 2G
                    arch: aarch64
                    default_partitions:
                      OVMF_CODE.fd: /usr/share/AAVMF/AAVMF_CODE.fd
                      OVMF_VARS.fd: /usr/share/AAVMF/AAVMF_VARS.fd
                    hostfwd:
                      ssh:
                        hostport: 9022
                        guestport: 22
              EOF

              sleep 60s

              echo "Starting the exporter ..."

              jmp run --exporter-config qemu-exporter.yaml
