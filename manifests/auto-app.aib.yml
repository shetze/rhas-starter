# Example of a minimal image with auto-app RPM installed

name: auto-app

content:
  repos:
    - id: epel
      baseurl: https://ftp-stud.hs-esslingen.de/pub/epel/10.4/Everything/aarch64/
      priority: 20
    - id: bigmachine
      baseurl: http://rpmrepo-rpmrepo.apps.ocp.boernig.name/AutoSD-AT/repos/10-stream/
      priority: 10
    - id: local
      baseurl: file:///workspace/src/bin
      priority: 5      
  rpms:
    - auto-app
    - vim
    - curl
    - gdb
    - greenboot-default-health-checks
    - iproute
    - iputils
    - less
    - openssh-clients
    - openssh-server
    - pciutils
    - podman
    - python3-pip
    - qm
    - strace
    - stress-ng
    - tcpdump
    - xauth
    - xterm
    - auto-apps
    - dlt-daemon
    - dlt-tools
    - vsomeip3-routingmanager
    - vsomeip3-selinux
    - vsomeip3-tools
  container_images:
    - source: quay.io/shetze/auto-apps
      tag: latest
      name: localhost/auto-apps
  make_dirs:
    - path: /etc/containers/systemd/
      parents: true
      exist_ok: true
  add_files:
    - path: /etc/containers/systemd/engine.container
      text: |
        [Unit]
        Description=Demo engine service container
        Requires=routingmanagerd.socket
        
        [Container]
        Image=localhost/auto-apps
        Volume=/run/vsomeip:/run/vsomeip
        Exec=/usr/bin/engine-service
        
        [Service]
        Restart=always
        
        [Install]
        WantedBy=multi-user.target
    - path: /etc/vsomeip.json
      text: |
        {
          "routing": {
            "host": {
              "name": "routingmanagerd",
              "unicast": "10.88.0.1",
              "port": "31000"
            },
            "guests": {
              "unicast": "10.88.0.1",
              "ports": [
                {
                  "first": "1026",
                  "last": "65535"
                }
              ]
            }
          },
          "logging": {
            "level": "info",
            "console": "true",
            "dlt": "false"
          },
          "applications": [
            {
              "name": "routingmanagerd",
              "id": "0x0101"
            },
            {
              "name": "Radio",
              "id": "0x1000"
            },
            {
              "name": "Engine",
              "id": "0x1001"
            },
            {
              "name": "Radio client",
              "id": "0x1002"
            }
          ],
          "services": [
            {
              "service": "0x1000",
              "instance": "0x01",
              "unreliable": "30509"
            },
            {
              "service": "0x1001",
              "instance": "0x01",
              "unreliable": "30509"
            }
          ],
          "service-discovery": {
            "enable": "true",
            "multicast": "224.224.224.245",
            "port": "30490",
            "protocol": "tcp",
            "initial_delay_min": "10",
            "initial_delay_max": "100",
            "repetitions_base_delay": "200",
            "repetitions_max": "3",
            "ttl": "3",
            "cyclic_offer_delay": "2000",
            "request_response_delay": "1500"
          }
        }

  systemd:
    enabled_services:
      # Enable ssh daemon
      - sshd.service
      - routingmanagerd.service
      - dlt.service


qm:
  content:
    repos:
      - id: epel
        baseurl: https://ftp-stud.hs-esslingen.de/pub/epel/10.4/Everything/aarch64/
        priority: 20
      - id: bigmachine
        baseurl: http://rpmrepo-rpmrepo.apps.ocp.boernig.name/AutoSD-AT/repos/10-stream/
        priority: 10
    rpms:
      - python3-pip
      - vim
      - iproute
      - curl
      - strace
      - iputils
      - tcpdump
      - auto-apps
    container_images:
      - source: quay.io/centos/arm64v8
        tag: stream10
        name: localhost/cs10      
      - source: quay.io/shetze/auto-apps
        tag: latest
        name: localhost/auto-apps
    add_files:
      - path: /etc/containers/systemd/radio.container
