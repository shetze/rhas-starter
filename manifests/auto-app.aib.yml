# Example of a minimal image with auto-app RPM installed

name: auto-app

content:
  repos:
    - id: alex
      baseurl: https://download.copr.fedorainfracloud.org/results/alexl/cs9-sample-images/centos-stream-9-$arch/
      priority: 10
    - id: local
      baseurl: file:///workspace/src/bin
      priority: 5      
  rpms:
    - auto-app
    - vim
    - curl
    - dlt-daemon
    - dlt-tools
    - gdb
    - greenboot-default-health-checks
    - iproute
    - iputils
    - less
    - openssh-clients
    - openssh-server
    - pciutils
    - podman
    - python3-pip
    - qm
    - strace
    - stress-ng
    - tcpdump
    - xauth
    - xterm

  make_dirs:
    - path: /etc/containers/systemd/
      parents: true
      exist_ok: true
  add_files:
    - path: /etc/containers/systemd/engine.container
      text: |
        [Unit]
        Description=Demo engine service container
        Requires=routingmanagerd.socket
        
        [Container]
        Image=localhost/auto-apps
        Volume=/run/vsomeip:/run/vsomeip
        Exec=/usr/bin/engine-service
        
        [Service]
        Restart=always
        
        [Install]
        WantedBy=multi-user.target


qm:
  content:
    rpms:
      - python3-pip
      - vim
      - iproute
      - curl
      - strace
      - iputils
      - tcpdump
    container_images:
      - source: quay.io/centos/centos
        tag: stream10
        name: localhost/cs10      

network:
  dynamic: {}

